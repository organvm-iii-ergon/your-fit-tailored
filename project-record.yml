limitations:
  - id: no-domain-runtime
    statement: The intended circular-apparel domain architecture is not implemented in src/.
    assertion_ref: docs/evidence/assertions/runtime-status.json
    assertion_id: yft.runtime-status.v1
  - id: no-configured-pilot
    statement: No configured Airtable or Retool environment, completed launch gate, pilot cohort, or operational cycle is evidenced.
    assertion_ref: docs/evidence/assertions/pilot-status.json
    assertion_id: yft.pilot-status.v1
  - id: generic-scaffold-only
    statement: The locally tested TypeScript package models generic catalog and subscription behavior rather than the specified platform.
    assertion_ref: docs/evidence/assertions/typescript-scaffold.json
    assertion_id: yft.typescript-scaffold.v1
  - id: broken-default-tooling
    statement: Standard dependency installation and ESLint are blocked by a TypeScript and typescript-eslint compatibility conflict.
    assertion_ref: docs/evidence/assertions/tooling-health.json
    assertion_id: yft.tooling-health.v1
  - id: no-outcome-evidence
    statement: No user, fit, retention, revenue, contribution-margin, environmental-impact, or scale outcome is evidenced.
  - id: incomplete-policy-boundaries
    statement: Payment integration, privacy, legal agreements, insurance, safety and hygiene, and production security remain incomplete.
